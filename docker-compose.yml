name: pg-control-plane

services:
  metadata-db:
    image: postgres:18
    container_name: pgcontrol_metadata
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgcontrol
      POSTGRES_PASSWORD: pgcontrolpass
      POSTGRES_DB: pgcontrol
    volumes:
      - pgcontrol_metadata_data:/var/lib/postgresql
      - ./docker/metadata-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pgcontrol
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgcontrol"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend/PgControl.Api
      dockerfile: Dockerfile
    container_name: pgcontrol_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Metadata: "Host=metadata-db;Port=5432;Database=pgcontrol;Username=pgcontrol;Password=pgcontrolpass"
      Jwt__Key: "dev-only-key-change-in-prod-min-32-chars!!"
      Jwt__Issuer: "pg-control"
      DOCKER_API_VERSION: "1.41"
      Controller__BaseUrl: "http://docker-controller:6000"
      Controller__Token: "change-me-in-production-please-32-chars-min"
    depends_on:
      metadata-db:
        condition: service_healthy
      docker-controller:
        condition: service_started
    ports:
      - "5000:5000"
    networks:
      - pgcontrol
      - ha-network
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./migrations:/migrations:ro

  docker-controller:
    build:
      context: ./docker-controller
      dockerfile: Dockerfile
    image: pgcontrol-docker-controller:local
    container_name: pgcontrol_docker_controller
    restart: unless-stopped
    environment:
      Controller__Token: "change-me-in-production-please-32-chars-min"
      Controller__HostComposeDir: "/opt/postgreHA"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/postgreHA:/opt/postgreHA:ro
    networks:
      - pgcontrol

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pgcontrol_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - pgcontrol
      - proxy

networks:
  pgcontrol:
    driver: bridge
  ha-network:
    external: true
    name: pg-ha-lab_pgnet
  proxy:
    external: true
    name: proxy

volumes:
  pgcontrol_metadata_data:
