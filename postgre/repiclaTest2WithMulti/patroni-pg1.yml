scope: pgcluster
name: pg1

restapi:
  listen: 0.0.0.0:8008
  connect_address: pg1:8008

etcd3:
  hosts: etcd1:2379,etcd2:2379,etcd3:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: on
        max_wal_senders: 5
        max_replication_slots: 5
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256
  users:
    admin:
      password: adminpass
      options:
        - createrole
        - createdb

postgresql:
  listen: 0.0.0.0:5432
  connect_address: pg1:5432
  data_dir: /var/lib/postgresql/data/pgdata
  bin_dir: /usr/lib/postgresql/18/bin
  parameters:
    wal_level: replica
    hot_standby: on
    max_wal_senders: 5
    max_replication_slots: 5
    archive_mode: "on"
    archive_command: "pgbackrest --stanza=pgcluster archive-push %p"
    archive_timeout: 60
    restore_command: "pgbackrest --stanza=pgcluster archive-get %f \"%p\""
  authentication:
    superuser:
      username: postgres
      password: postgrespass
    replication:
      username: replicator
      password: replpass
    rewind:
      username: rewind_user
      password: rewindpass
