global
    maxconn 200

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Yazma üçün – yalnız PRIMARY node-a yönləndirir
listen postgres_write
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008

# Oxuma üçün – yalnız REPLIKA node-a yönləndirir
listen postgres_read
    bind *:5001
    option httpchk OPTIONS /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008

# Patroni REST API (debug üçün)
listen patroni_api
    bind *:8008
    server pg1 pg1:8008
    server pg2 pg2:8008
