# /etc/pgbackrest/pgbackrest.conf (konteynerin içində)

[global]
# --- Repository (backup + WAL arxivi) ---
# DİQQƏT: repo data ilə EYNİ diskdə olmamalıdır. Disk ölərsə həm baza, həm backup itir.
# Minimum: ayrı disk/mount. Düzgün variant: S3-uyğun obyekt saxlama (aşağıda).
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=6
# repo1-retention-archive yazılmasa, WAL saxlanması full backup-lara uyğunlaşır

# --- S3 variantı (lokal repo əvəzinə tövsiyə olunur) ---
# repo1-type=s3
# repo1-s3-endpoint=s3.eu-central-1.amazonaws.com
# repo1-s3-region=eu-central-1
# repo1-s3-bucket=my-pg-backups
# repo1-s3-key=ACCESS_KEY
# repo1-s3-key-secret=SECRET_KEY
# repo1-path=/pgbackrest
# repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass=CHANGE_ME_LONG_RANDOM

# --- Performans (6 GB server, az CPU) ---
process-max=1
compress-type=zst
compress-level=3
start-fast=y
delta=y

# --- WAL arxivi (asinxron: yazma gecikməsini azaldır) ---
archive-async=y
spool-path=/var/spool/pgbackrest

# --- Log ---
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info

[main]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
# POSTGRES_USER=appuser olduğu üçün "postgres" rolu yoxdur. .env-dəki POSTGRES_USER ilə eyni olmalıdır.
pg1-user=sysadmin
pg1-database=appdb
