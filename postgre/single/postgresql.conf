# =============================================================================
# postgresql.conf - PostgreSQL 18, production
# Fərziyyə: konteynerə 4 GB RAM, 2 vCPU, SSD, PgBouncer arxasında.
# Host cəmi 6 GB RAM-dır, qalan ~2 GB OS/Docker/PgBouncer üçündür.
# =============================================================================

# -----------------------------------------------------------------------------
# CONNECTIONS
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 60              # PgBouncer arxasında kifayətdir; hər bağlantı RAM yeyir
superuser_reserved_connections = 3
password_encryption = scram-sha-256

# -----------------------------------------------------------------------------
# YADDAŞ (4 GB konteyner)
# -----------------------------------------------------------------------------
shared_buffers = 1GB              # konteyner RAM-ının ~25%-i
effective_cache_size = 2560MB     # planlaşdırıcı üçün ipucu, real yaddaş ayırmır
work_mem = 8MB                    # hər sort/hash addımına; 60 bağlantı * bir neçə addım hesabı ilə
maintenance_work_mem = 256MB      # VACUUM, CREATE INDEX
huge_pages = try
wal_buffers = 16MB

# SSD
random_page_cost = 1.1
effective_io_concurrency = 200
seq_page_cost = 1.0

# CPU (2 vCPU)
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# -----------------------------------------------------------------------------
# WAL / CHECKPOINT / DURABILITY
# -----------------------------------------------------------------------------
wal_level = replica
fsync = on                        # heç vaxt söndürməyin
synchronous_commit = on           # payroll/mühasibat datası üçün
full_page_writes = on
wal_compression = on
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# -----------------------------------------------------------------------------
# WAL ARXİVİ (pgBackRest ilə PITR)
# Stanza yaradılana qədər arxiv uğursuz olacaq (stanza-create-dən əvvəl qısa müddət normaldır).
# -----------------------------------------------------------------------------
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'
archive_timeout = 60              # ən azı 60 saniyədə bir WAL seqmentini arxivlə
                                  # → fəlakətdə itki həddi təxminən 1 dəqiqə + arxivlənməmiş WAL

# Replika üçün ehtiyat (ikinci server əlavə etsəniz lazım olacaq)
max_wal_senders = 5
max_replication_slots = 5
hot_standby = on

# Diski doldurmaqdan qorunma: slot-lar WAL-ı sonsuz saxlamasın (PG 13+)
max_slot_wal_keep_size = 4GB

# -----------------------------------------------------------------------------
# AUTOVACUUM
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 800

# -----------------------------------------------------------------------------
# TIMEOUTS
# -----------------------------------------------------------------------------
idle_in_transaction_session_timeout = 5min
lock_timeout = 30s
deadlock_timeout = 1s
# statement_timeout = 60s         # rol/tətbiq səviyyəsində təyin etmək daha təhlükəsizdir
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# -----------------------------------------------------------------------------
# LOCALE / TIMEZONE
# -----------------------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.simple'
client_encoding = 'UTF8'

# -----------------------------------------------------------------------------
# LOGGING (Docker stdout)
# -----------------------------------------------------------------------------
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s

# -----------------------------------------------------------------------------
# MONİTORİNQ
# -----------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all
track_activity_query_size = 4096
track_io_timing = on
# Bazada bir dəfə: CREATE EXTENSION pg_stat_statements;
